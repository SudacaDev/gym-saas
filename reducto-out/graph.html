<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reducto — Knowledge Graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg:     #1E1E2E;
    --panel:  #252434;
    --text:   #DDB6C7;
    --muted:  #7B7896;
    --accent: #FECE84;
    --edge:   #4A4F6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 340px;
    height: 100vh;
  }
  #graph {
    background: var(--bg);
    position: relative;
    width: 100%;
    height: 100vh;
  }
  #sidebar {
    background: var(--panel);
    border-left: 1px solid rgba(221, 182, 199, 0.08);
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .brand h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--text);
    text-transform: uppercase;
  }
  .brand .tagline {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }
  .section {
    background: rgba(0,0,0,0.15);
    border-radius: 8px;
    padding: 14px;
    border: 1px solid rgba(221, 182, 199, 0.06);
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 12px 0;
  }
  #search {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(221, 182, 199, 0.15);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--accent); }
  .node-info {
    font-size: 13px;
    line-height: 1.5;
  }
  .node-info .placeholder {
    color: var(--muted);
    font-style: italic;
  }
  .node-info .name {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .node-info .kind {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .node-info .path {
    color: var(--muted);
    font-size: 11px;
    font-family: 'SF Mono', Menlo, monospace;
    word-break: break-all;
    margin-bottom: 8px;
  }
  .node-info .signature {
    background: rgba(0,0,0,0.4);
    border-left: 2px solid var(--accent);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 12px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 8px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    cursor: pointer;
    font-size: 13px;
  }
  .filter-row input[type=checkbox] {
    accent-color: var(--accent);
  }
  .filter-row .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .filter-row .count {
    margin-left: auto;
    color: var(--muted);
    font-size: 11px;
  }
  #footer {
    position: absolute;
    bottom: 12px;
    left: 16px;
    font-size: 12px;
    color: var(--muted);
    background: rgba(30,30,46,0.7);
    padding: 6px 12px;
    border-radius: 6px;
    backdrop-filter: blur(4px);
  }
  #footer strong {
    color: var(--text);
    font-weight: 600;
  }
</style>
</head>

    </div>

      <div id="filters-state"></div>

  </aside>
</div>

ces/SharedDocuments/gym-saas/db/rls-context.ts", "title": "IMPORTS", "color": {"color": "#FFD6A5", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/dashboard-metrics.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/lib/dashboard/metrics.ts", "title": "IMPORTS", "color": {"color": "#FFD6A5", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/dashboard-metrics.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/dashboard-metrics.test.ts::addDays", "title": "DEFINES", "color": {"color": "#FFD6A5", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/member-soft-delete.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/db/client.ts", "title": "IMPORTS", "color": {"color": "#C3B1E1", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/member-soft-delete.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/db/rls-context.ts", "title": "IMPORTS", "color": {"color": "#C3B1E1", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/membership-renewal.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/lib/memberships/renewal.ts", "title": "IMPORTS", "color": {"color": "#DDB6C7", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/membership-status.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/lib/memberships/status.ts", "title": "IMPORTS", "color": {"color": "#F0E68C", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/membership-status.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/membership-status.test.ts::membership", "title": "DEFINES", "color": {"color": "#F0E68C", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/payment-extends-membership.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/db/client.ts", "title": "IMPORTS", "color": {"color": "#DDB6C7", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/payment-extends-membership.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/db/rls-context.ts", "title": "IMPORTS", "color": {"color": "#DDB6C7", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/payment-extends-membership.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/lib/memberships/renewal.ts", "title": "IMPORTS", "color": {"color": "#DDB6C7", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}, {"from": "C:/Workspaces/SharedDocuments/gym-saas/tests/unit/payment-receipt.test.ts", "to": "C:/Workspaces/SharedDocuments/gym-saas/lib/email/payment-receipt.ts", "title": "IMPORTS", "color": {"color": "#F9CB8F", "highlight": "#FECE84", "opacity": 0.4}, "width": 1, "smooth": {"type": "continuous", "roundness": 0.2}}];

  const data = {
    nodes: new vis.DataSet(allNodes),
    edges: new vis.DataSet(allEdges),
  };

  const container = document.getElementById("graph");

  const options = {
    nodes: {
      shape: "dot",
      font: {
        color: "#DDB6C7",
        size: 11,
        face: "system-ui",
      },
      borderWidth: 1,
      shadow: {
        enabled: true,
        color: "rgba(0,0,0,0.5)",
        size: 6,
        x: 0, y: 2,
      },
    },
    edges: {
      arrows: {
        to: { enabled: true, scaleFactor: 0.5, type: "arrow" },
      },
      smooth: { type: "continuous", roundness: 0.2 },
      width: 1,
      selectionWidth: 2,
    },
    physics: {
      enabled: true,
      barnesHut: {
        gravitationalConstant: -8000,
        centralGravity: 0.15,
        springLength: 110,
        springConstant: 0.03,
        damping: 0.4,
        avoidOverlap: 0.2,
      },
      stabilization: { iterations: 300 },
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
    },
  };

  const network = new vis.Network(container, data, options);

  // ----------------------------------------------------------------
  // Click en nodo → mostrar info
  // ----------------------------------------------------------------
  const infoBox = document.getElementById("node-info");

  network.on("click", function (params) {
    if (params.nodes.length === 0) {
      infoBox.innerHTML = '<div class="placeholder">Click a node to inspect it</div>';
      return;
    }
    const nodeId = params.nodes[0];
    const node = allNodes.find(n => n.id === nodeId);
    if (!node) return;

    const kindColor = KIND_COLORS[node.kind] || "#888";
    const stateLabel = STATE_LABELS[node.state] || node.state;

    let html = '';
    html += '<div class="name">' + escapeHtml(node._name || node.id) + '</div>';
    html += '<span class="kind" style="background:' + kindColor + '33;color:' + kindColor + '">' + node.kind + '</span> ';
    html += '<span class="kind" style="background:rgba(0,0,0,0.3);color:var(--muted)">' + stateLabel + '</span>';
    if (node.community >= 0) {
      const comm = COMMUNITIES.find(c => c.id === node.community);
      if (comm) html += '<span class="kind" style="background:' + comm.color + '33;color:' + comm.color + '">C' + comm.id + '</span>';
    }
    if (node._file) {
      html += '<div class="path">' + escapeHtml(node._file) + (node._line ? ':' + node._line : '') + '</div>';
    }
    if (node._signature) {
      html += '<div class="signature">' + escapeHtml(node._signature) + '</div>';
    } else if (node.state === 'unknown') {
      html += '<div style="font-size:11px;color:var(--muted);margin-top:6px;font-style:italic">Not yet resolved — run `reducto query "' + escapeHtml(node._name || '') + '" --resolve` to load the signature.</div>';
    }
    infoBox.innerHTML = html;
  });

  // ----------------------------------------------------------------
  // Búsqueda
  // ----------------------------------------------------------------
  document.getElementById("search").addEventListener("input", function (e) {
    const q = e.target.value.toLowerCase().trim();
    if (!q) {
      data.nodes.update(allNodes.map(n => ({ id: n.id, hidden: false })));
      return;
    }
    const updates = allNodes.map(n => ({
      id: n.id,
      hidden: !((n._name || "").toLowerCase().includes(q) || (n._file || "").toLowerCase().includes(q)),
    }));
    data.nodes.update(updates);
  });

  // ----------------------------------------------------------------
  // Filtros por tipo de nodo
  // ----------------------------------------------------------------
  function buildKindFilters() {
    const counts = {};
    allNodes.forEach(n => {
      counts[n.kind] = (counts[n.kind] || 0) + 1;
    });
    const container = document.getElementById("filters-kind");
    Object.keys(KIND_COLORS).forEach(kind => {
      if (!counts[kind]) return;
      const row = document.createElement("label");
      row.className = "filter-row";
      row.innerHTML =
        '<input type="checkbox" data-kind="' + kind + '" checked>' +
        '<span class="dot" style="background:' + KIND_COLORS[kind] + '"></span>' +
        '<span>' + kind + '</span>' +
        '<span class="count">' + counts[kind] + '</span>';
      container.appendChild(row);
    });
    container.addEventListener("change", applyFilters);
  }

  function buildStateFilters() {
    const counts = { unknown: 0, partial: 0, known: 0 };
    allNodes.forEach(n => { counts[n.state] = (counts[n.state] || 0) + 1; });
    const container = document.getElementById("filters-state");
    Object.keys(STATE_LABELS).forEach(state => {
      if (!counts[state]) return;
      const row = document.createElement("label");
      row.className = "filter-row";
      row.innerHTML =
        '<input type="checkbox" data-state="' + state + '" checked>' +
        '<span class="dot" style="background:' + STATE_BORDER[state] + '"></span>' +
        '<span>' + STATE_LABELS[state] + '</span>' +
        '<span class="count">' + counts[state] + '</span>';
      container.appendChild(row);
    });
    container.addEventListener("change", applyFilters);
  }

  function applyFilters() {
    const enabledKinds = new Set(
      Array.from(document.querySelectorAll('[data-kind]:checked')).map(el => el.dataset.kind)
    );
    const enabledStates = new Set(
      Array.from(document.querySelectorAll('[data-state]:checked')).map(el => el.dataset.state)
    );
    const enabledCommunities = new Set(
      Array.from(document.querySelectorAll('[data-community]:checked')).map(el => parseInt(el.dataset.community))
    );
    const hasCommunityFilter = document.querySelectorAll('[data-community]').length > 0;

    const updates = allNodes.map(n => ({
      id: n.id,
      hidden: !enabledKinds.has(n.kind)
           || !enabledStates.has(n.state)
           || (hasCommunityFilter && n.community >= 0 && !enabledCommunities.has(n.community)),
    }));
    data.nodes.update(updates);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  buildKindFilters();
  buildStateFilters();
  buildCommunityFilters();

  function buildCommunityFilters() {
    const container = document.getElementById("filters-community");
    if (!COMMUNITIES.length) {
      container.innerHTML = '<span style="color:var(--muted);font-size:12px">Run reducto ingest to detect</span>';
      return;
    }
    // Select All
    const allRow = document.createElement("label");
    allRow.className = "filter-row";
    allRow.innerHTML =
      '<input type="checkbox" id="community-all" checked>' +
      '<span style="font-weight:600;font-size:12px">Select All</span>' +
      '<span class="count">' + COMMUNITIES.length + '</span>';
    container.appendChild(allRow);
    document.getElementById("community-all").addEventListener("change", function(e) {
      document.querySelectorAll("[data-community]").forEach(cb => { cb.checked = e.target.checked; });
      applyFilters();
    });

    COMMUNITIES.forEach(c => {
      const row = document.createElement("label");
      row.className = "filter-row";
      row.innerHTML =
        '<input type="checkbox" data-community="' + c.id + '" checked>' +
        '<span class="dot" style="background:' + c.color + '"></span>' +
        '<span style="font-size:12px">' + escapeHtml(c.label) + '</span>' +
        '<span class="count">' + c.size + '</span>';
      container.appendChild(row);
    });
    container.addEventListener("change", applyFilters);
  }
</script>
</body>
</html>
